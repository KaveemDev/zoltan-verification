name: Deploy frontend to Hostinger

# Optional: builds frontend/ and uploads it to the sign.zoltanvisa.com folder over FTPS on every push.
# (Without it: run `npm run build` in frontend/ and upload dist/ in hPanel → File Manager.)
# Repository settings → Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (from hPanel → Files → FTP Accounts).
# Repository settings → Variables: API_ORIGIN (https://api.zoltanvisa.com),
#   STORAGE_ORIGIN (https://<account-id>.r2.cloudflarestorage.com), optional FTP_SERVER_DIR, FTP_PROTOCOL,
#   DEMO=true for a no-backend client preview (API_ORIGIN/STORAGE_ORIGIN then not needed).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write .env.production from repository variables
        run: |
          printf 'VITE_API_URL=%s\nVITE_STORAGE_ORIGIN=%s\nVITE_DEMO=%s\n' "${{ vars.API_ORIGIN }}" "${{ vars.STORAGE_ORIGIN }}" "${{ vars.DEMO }}" > .env.production

      - run: npm ci
      - run: npm test
      # Also writes dist/.htaccess; fails if the two variables are missing.
      - run: npm run build

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: 21
          local-dir: frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
